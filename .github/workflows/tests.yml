# Runs the offline test suite on every push and pull request.
# The tests replace Statistics Canada and the Bank of Canada with fake services, so no data is downloaded.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
